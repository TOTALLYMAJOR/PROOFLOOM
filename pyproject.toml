[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "design-intelligence"
version = "1.0.0"
description = "Standalone design intelligence package for Codex and Claude."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TOTALLYMAJOR" }]
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
design-intelligence = "design_intelligence.cli:main"
design-intelligence-inspect = "repo_fit.inspect:main"
design-intelligence-assess = "repo_fit.assess:main"

[tool.setuptools.packages.find]
include = ["design_intelligence", "design_intelligence.*", "repo_fit"]

[tool.setuptools.package-data]
design_intelligence = ["data/product_profiles/*.json"]
